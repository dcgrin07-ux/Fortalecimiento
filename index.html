<script>
/* =========================================================
   FORTALECIMIENTO APP — SISTEMA TRAYECTORIAS
   Versión corregida:
   - Nunca borra historial ante un error de interfaz.
   - Guarda registros de manera atómica.
   - Protege nombres con caracteres especiales.
   - "Próximo encuentro" visible al abrir cada alumno.
   - Mover alumno conserva ID e historial.
   - Backup JSON compatible.
========================================================= */

const STORAGE_KEY = "datos_sistema_v8";

const DEFAULT_DB = {
  datosCurso:{},
  tiposCurso:{},
  nombreEscuela:"Mi Escuela",
  nivelInstitucion:"Primario",
  listaAlumnos:[],
  registrosAlumnos:{},
  cursosNombres:{
    "Mañana":["3° A","3° B","4° A","4° B","5° A","5° B","6° A","6° B"],
    "Tarde":["3° C","3° D","4° C","4° D","5° C","5° D","6° C","6° D"]
  },
  instituciones:[],
  institucionActivaId:""
};

let db = cargarDatosSeguros();

const catOrder=["1-A","1-B","2-A","2-B","2-C","2-D","3","4","5","6"];
const catInfo={
"1-A":["1-A Presilábica Indiferenciada","No hay correspondencia con grafemas. Uso de dibujos o trazos sin orden."],
"1-B":["1-B Presilábica Diferenciada","Busca variedad en los caracteres, intenta diferenciar letras de dibujos."],
"2-A":["2-A Silábica sin valor sonoro","Escribe una letra por sílaba, pero sin relación con el sonido real."],
"2-B":["2-B Silábico con valor sonoro","Escribe una letra por sílaba, y la letra coincide con una vocal o consonante real."],
"2-C":["2-C Silábico-alfabética","Transición: algunas sílabas completas, otras incompletas."],
"2-D":["2-D Cuasi alfabética","Escribe casi todas las sílabas, pero con omisiones en sílabas complejas."],
"3":["3 Escritura alfabética","Representa cada sonido con su letra. Puede haber errores de ortografía."],
"4":["4 Alf. con separación","Logra segmentar palabras de forma convencional y estructurar oraciones."],
"5":["5 Alf. con ortografía","Uso correcto de la mayoría de las reglas ortográficas y puntuación básica."],
"6":["6 Escritura avanzada","Dominio total de la ortografía, tildes, puntuación y vocabulario preciso."]
};

const nivelesEscrituraRapida=[
{id:"1",nombre:"1. Presilábica indiferenciada"},
{id:"2",nombre:"2. Presilábica diferenciada"},
{id:"3",nombre:"3. Silábica sin valor sonoro"},
{id:"4",nombre:"4. Silábica con valor sonoro"},
{id:"5",nombre:"5. Silábico-alfabética"},
{id:"6",nombre:"6. Cuasi alfabética"},
{id:"7",nombre:"7. Alfabética"},

{id:"9",nombre:"9. Alfabética con ortografía"},
{id:"10",nombre:"10. Escritura avanzada"}
];

const nivelesLectura=[
{id:"Nivel 1",nombre:"Nivel 1 — Reconocimiento inicial",desc:"Reconoce algunas letras y/o palabras conocidas con apoyo."},
{id:"Nivel 2",nombre:"Nivel 2 — Lectura silábica",desc:"Realiza lectura predominantemente silábica, con apoyo frecuente."},
{id:"Nivel 3",nombre:"Nivel 3 — Lectura de palabras",desc:"Lee palabras, especialmente las conocidas, aunque puede presentar dificultades ante palabras nuevas."},

{id:"Nivel 7",nombre:"Nivel 7 — Lectura autónoma y comprensiva",desc:"Lee de manera autónoma y logra interpretar información relevante del texto."}
];

const nivelesComprension=[
{id:"Inicial",nombre:"Inicial",desc:"Requiere mediación constante para comprender."},

{id:"Avanzada",nombre:"Avanzada",desc:"Realiza inferencias y puede fundamentar sus respuestas."}
];

{id:"Autónomo",badge:"🟢",nombre:"Autónomo"},
{id:"Apoyo ocasional",badge:"🟡",nombre:"Apoyo ocasional"},
{id:"Apoyo frecuente",badge:"🟠",nombre:"Apoyo frecuente"},
{id:"Apoyo permanente",badge:"🔴",nombre:"Apoyo permanente"}
];

const opcionesEvolucion=[
{id:"Avanza",badge:"🟢",nombre:"Avanza"},
{id:"Se mantiene",badge:"🟡",nombre:"Se mantiene"},
{id:"Presenta retroceso",badge:"🔴",nombre:"Presenta dificultades / retrocede"}
];

const continuarEscrituraOpts=[
"Correspondencia fonema-grafema","Conciencia fonológica","Escritura autónoma",
"Completamiento de palabras","Escritura de palabras","Escritura de oraciones",
"Separación entre palabras","Ortografía","Puntuación","Producción de textos"
];

const continuarLecturaOpts=[
"Reconocimiento de letras","Correspondencia grafema-fonema","Lectura de sílabas",
"Lectura de palabras","Lectura de oraciones","Fluidez","Autonomía lectora"
];

const continuarComprensionOpts=[
"Comprensión literal","Localización de información explícita","Secuenciación de hechos",
"Inferencias","Anticipación","Relación entre información del texto",
"Interpretación global","Vocabulario en contexto","Opinión y fundamentación"
];

function deepClone(o){return JSON.parse(JSON.stringify(o));}

function crearInstitucionDesdeDatos(data,nombre,nivel){
  const base={
    id:crearId(), nombreEscuela:nombre||"Mi Escuela", nivelInstitucion:nivel||"Primario",
    datosCurso:deepClone(data.datosCurso||{}), tiposCurso:deepClone(data.tiposCurso||{}),
    cursosNombres:deepClone(data.cursosNombres||DEFAULT_DB.cursosNombres),
    listaAlumnos:deepClone(data.listaAlumnos||[]), registrosAlumnos:deepClone(data.registrosAlumnos||{})
  };
  return base;
}

function prepararInstitucion(inst){
  if(!inst.id)inst.id=crearId();
  if(!inst.nombreEscuela)inst.nombreEscuela="Mi Escuela";
  if(!inst.nivelInstitucion)inst.nivelInstitucion="Primario";
  if(!inst.cursosNombres||typeof inst.cursosNombres!=="object")inst.cursosNombres=deepClone(DEFAULT_DB.cursosNombres);
  if(!inst.datosCurso||typeof inst.datosCurso!=="object")inst.datosCurso={};
  if(!inst.tiposCurso||typeof inst.tiposCurso!=="object")inst.tiposCurso={};
  if(!Array.isArray(inst.listaAlumnos))inst.listaAlumnos=[];
  if(!inst.registrosAlumnos||typeof inst.registrosAlumnos!=="object")inst.registrosAlumnos={};
  inst.listaAlumnos.forEach(a=>{
    if(!a.id)a.id=crearId();
    if(a.activo===undefined)a.activo=true;
    if(!a.curso)a.curso="";
    if(!a.cat)a.cat=inst.nivelInstitucion==="Primario"?"1-A":"otros";
    if(!Array.isArray(a.historialCursos)) a.historialCursos=a.curso?[{curso:a.curso,desde:null,hasta:null,motivo:"Registro previo"}]:[];
  });
  Object.keys(inst.registrosAlumnos).forEach(id=>{if(!Array.isArray(inst.registrosAlumnos[id]))inst.registrosAlumnos[id]=[];});
  return inst;
}

function fusionarConDefault(data){
  const out=deepClone(DEFAULT_DB);
  if(!data || typeof data!=="object") return out;

  // Migración transparente: una instalación anterior se convierte en la primera institución.
  if(Array.isArray(data.instituciones) && data.instituciones.length){
    out.instituciones=data.instituciones.map(prepararInstitucion);
    out.institucionActivaId=data.institucionActivaId||out.instituciones[0].id;
  }else{
    const legacy={
      nombreEscuela:typeof data.nombreEscuela==="string"?data.nombreEscuela:"Mi Escuela",
      nivelInstitucion:typeof data.nivelInstitucion==="string"?data.nivelInstitucion:"Primario",
      datosCurso:data.datosCurso,tiposCurso:data.tiposCurso,cursosNombres:data.cursosNombres,
      listaAlumnos:data.listaAlumnos,registrosAlumnos:data.registrosAlumnos
    };
    const inst=prepararInstitucion(crearInstitucionDesdeDatos(legacy,legacy.nombreEscuela,legacy.nivelInstitucion));
    out.instituciones=[inst]; out.institucionActivaId=inst.id;
  }

  const activa=out.instituciones.find(i=>i.id===out.institucionActivaId)||out.instituciones[0];
  out.institucionActivaId=activa.id;
  out.nombreEscuela=activa.nombreEscuela; out.nivelInstitucion=activa.nivelInstitucion;
  out.datosCurso=activa.datosCurso; out.tiposCurso=activa.tiposCurso;
  out.cursosNombres=activa.cursosNombres; out.listaAlumnos=activa.listaAlumnos; out.registrosAlumnos=activa.registrosAlumnos;
  return out;
}

function sincronizarInstitucionActiva(){
  const inst=(db.instituciones||[]).find(i=>i.id===db.institucionActivaId);
  if(!inst)return;
  inst.nombreEscuela=db.nombreEscuela; inst.nivelInstitucion=db.nivelInstitucion;
  inst.datosCurso=db.datosCurso; inst.tiposCurso=db.tiposCurso; inst.cursosNombres=db.cursosNombres;
  inst.listaAlumnos=db.listaAlumnos; inst.registrosAlumnos=db.registrosAlumnos;
}

function cargarDatosSeguros(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY) || localStorage.getItem("datos_sistema_v7") || localStorage.getItem("datos_sistema_v6");
    if(!raw)return deepClone(DEFAULT_DB);
    return fusionarConDefault(JSON.parse(raw));
  }catch(e){
    console.error("No se pudieron leer los datos:",e);
    alert("No se pudieron leer los datos guardados. La aplicación abrirá una estructura vacía para evitar modificar información dañada.");
    return deepClone(DEFAULT_DB);
  }
}

function guardar(){
  try{
    sincronizarInstitucionActiva();
    const copia=JSON.stringify(db);
    localStorage.setItem(STORAGE_KEY,copia);
    return true;
  }catch(e){
    console.error("Error al guardar:",e);
    alert("No se pudo guardar la información. NO se borraron los registros existentes.");
    return false;
  }
}

function cargarInstitucion(id){
  const actual=(db.instituciones||[]).find(i=>i.id===db.institucionActivaId);
  if(actual){
    actual.nombreEscuela=db.nombreEscuela; actual.nivelInstitucion=db.nivelInstitucion;
    actual.datosCurso=db.datosCurso; actual.tiposCurso=db.tiposCurso; actual.cursosNombres=db.cursosNombres;
    actual.listaAlumnos=db.listaAlumnos; actual.registrosAlumnos=db.registrosAlumnos;
  }
  const inst=(db.instituciones||[]).find(i=>i.id===id);
  if(!inst)return;
  db.institucionActivaId=inst.id; db.nombreEscuela=inst.nombreEscuela; db.nivelInstitucion=inst.nivelInstitucion;
  db.datosCurso=deepClone(inst.datosCurso); db.tiposCurso=deepClone(inst.tiposCurso);
  db.cursosNombres=deepClone(inst.cursosNombres); db.listaAlumnos=deepClone(inst.listaAlumnos); db.registrosAlumnos=deepClone(inst.registrosAlumnos);
  guardar(); mostrarInicio();
}

function nivelIcono(n){return n==="Inicial"?"🟢":(n==="Secundario"?"🟣":"🔵");}
function esNivelSinFortalecimiento(){return db.nivelInstitucion!=="Primario";}

function crearId(){
  return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9);
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function jsArg(v){return JSON.stringify(String(v??"")).replace(/&/g,"&amp;").replace(/"/g,"&quot;");}

function obtenerHistorial(id){
  if(!Array.isArray(db.registrosAlumnos[id])) db.registrosAlumnos[id]=[];
  return db.registrosAlumnos[id].filter(r=>r&&typeof r==="object");
}

function ultimoRegistro(id){
  const h=obtenerHistorial(id);
  return h.length?h[h.length-1]:null;
}

function obtenerPrioridades(r){
  if(!r)return [];
  let arr=Array.isArray(r.continuar)?r.continuar.slice():[];
  if(!arr.length){
    if(r.escritura && r.escritura!=="No registrado")arr.push("Continuar proceso de escritura");
    if(r.lectura && r.lectura!=="No registrado")arr.push("Continuar proceso de lectura");
    if(r.comprension && r.comprension!=="No registrado")arr.push("Fortalecer comprensión lectora");
  }
  return [...new Set(arr.filter(Boolean))];
}

function generarSugerencia(r){
  if(!r)return "Registrar el próximo encuentro y establecer prioridades de trabajo.";
  const p=obtenerPrioridades(r);
  if(p.length)return "Retomar y fortalecer: "+p.join(", ")+".";
  return "Dar continuidad al proceso, observando evolución y nivel de autonomía.";
}


function normalizarTipoCurso(c){
  if(!db.tiposCurso || typeof db.tiposCurso!=="object") db.tiposCurso={};
  if(db.tiposCurso[c]) return db.tiposCurso[c];
  const s=String(c||"").toLowerCase();
  if(/(^|\D)3\s*[°º]?/.test(s)||/(^|\D)4\s*[°º]?/.test(s)||/(^|\D)5\s*[°º]?/.test(s)||/(^|\D)6\s*[°º]?/.test(s)){
    return "fortalecimiento";
  }
  if(/(^|\D)1\s*[°º]?/.test(s)||/(^|\D)2\s*[°º]?/.test(s)){
    return "flexible";
  }
  return "fortalecimiento";
}

function esCursoFlexible(c){ return normalizarTipoCurso(c)==="flexible"; }

function obtenerAlumnosCurso(c){
  return db.listaAlumnos.filter(a=>a.curso===c);
}

function obtenerTodosLosCursos(){
  const salida=[];
  Object.values(db.cursosNombres||{}).forEach(lista=>{
    (Array.isArray(lista)?lista:[]).forEach(c=>{ if(c && !salida.includes(c)) salida.push(c); });
  });
  return salida;
}

function obtenerTurnoDeCurso(c){
  for(const [turno,lista] of Object.entries(db.cursosNombres||{})){
    if(Array.isArray(lista) && lista.includes(c)) return turno;
  }
  return null;
}

function htmlMoverCurso(id){
  const a=db.listaAlumnos.find(x=>x.id===id);
  if(!a)return "";
  const cursos=obtenerTodosLosCursos();
  const opciones=cursos.map(c=>`<option value="${esc(c)}" ${c===a.curso?"selected":""}>${esc(c)}${obtenerTurnoDeCurso(c)?" · "+esc(obtenerTurnoDeCurso(c)):""}</option>`).join("");
  const historial=Array.isArray(a.historialCursos)?a.historialCursos:[];
  const historialHtml=historial.length ? historial.slice().reverse().map((m,i)=>`
    <div class="small" style="padding:5px 0;border-bottom:1px solid #eee">
      <b>${esc(m.curso||"Sin curso")}</b>
      ${m.desde?" · desde "+esc(m.desde):""}
      ${m.hasta?" · hasta "+esc(m.hasta):" · actual"}
      ${m.motivo?" · "+esc(m.motivo):""}
    </div>`).join("") : '<p class="small">No hay movimientos de curso registrados todavía.</p>';
  return `
    <div class="seccion-formulario">
      <h3 style="margin-top:0">🏫 Curso del alumno</h3>
      <p style="margin:6px 0 10px"><b>Curso actual:</b> ${esc(a.curso||"Sin curso")}</p>
      <label>📂 Mover a:</label>
      <select id="select-curso-mover">${opciones}</select>
      <button class="move-btn" onclick="moverAlumnoCurso(${jsArg(id)})">↔️ Mover a este curso conservando TODO el historial</button>
      <details style="margin-top:10px">
        <summary><b>📜 Historial de cursos</b></summary>
        <div style="padding-top:8px">${historialHtml}</div>
      </details>
    </div>`;
}

function calcularEstadisticas(){
  const cursos=Object.values(db.cursosNombres||{}).flat();
  const todos= db.listaAlumnos || [];
  const activos=todos.filter(a=>a.activo!==false);
  const cursosFort=cursos.filter(c=>normalizarTipoCurso(c)==="fortalecimiento");
  const alumnosFort=activos.filter(a=>normalizarTipoCurso(a.curso)==="fortalecimiento");
  const terceros=cursos.filter(c=>/3\s*[°º]?/.test(String(c).toLowerCase()));
  const alumnosTerceros=activos.filter(a=>terceros.includes(a.curso));
  const categorias={};
  catOrder.forEach(id=>categorias[id]=0);
  alumnosFort.forEach(a=>{if(categorias[a.cat]!==undefined)categorias[a.cat]++;});
  return {cursos,todos,activos,cursosFort,alumnosFort,terceros,alumnosTerceros,categorias};
}

function mostrarEstadisticas(){
  if(esNivelSinFortalecimiento()){
    const activos=(db.listaAlumnos||[]).filter(a=>a.activo!==false);
    const cursos=Object.values(db.cursosNombres||{}).flat();
    const porCurso=cursos.map(c=>({c,n:activos.filter(a=>a.curso===c).length})).filter(x=>x.n>0);
    document.getElementById("app").innerHTML=`<h2>📊 Estadísticas</h2><button class="volver" onclick="mostrarInicio()">← Volver</button>
      <div class="stats-box"><h3 style="margin-top:0">${nivelIcono(db.nivelInstitucion)} ${esc(db.nivelInstitucion)}</h3><p style="font-size:20px">👥 Alumnos activos: <b>${activos.length}</b></p></div>

  const q=(document.getElementById("buscador-global")?.value||"").trim().toLowerCase();

  if(!box)return;
  if(!q){ box.innerHTML='<p class="small">Escribí un nombre o apellido para buscar.</p>'; return; }
  const resultados=(db.listaAlumnos||[]).filter(a=>String(a.nombre||"").toLowerCase().includes(q));
  if(!resultados.length){
    box.innerHTML='<div class="alerta">No encontré ningún alumno con ese nombre.</div>';
    return;
  }
  box.innerHTML=resultados.map(a=>{
    const turno=Object.keys(db.cursosNombres||{}).find(t=>(db.cursosNombres[t]||[]).includes(a.curso))||"";
    const tipo=a.tipoSeguimiento==="otro"?"📌 Seguimiento individual":(esCursoFlexible(a.curso)?"🟡 Seguimiento flexible":"🟢 Fortalecimiento");
    const cat=a.tipoSeguimiento==="otro"?"":(catInfo[a.cat]?catInfo[a.cat][0]:a.cat||"");

      <b style="font-size:17px">👤 ${esc(a.nombre)}</b><br>
      <span class="small">📍 ${esc(a.curso||"Sin curso")} · ${esc(turno||"Sin turno")} · ${tipo}${a.activo===false?" · INACTIVO":""}</span>
      ${cat?`<br><span class="small">🔤 ${esc(cat)}</span>`:""}

function crearNuevaInstitucion(){

  const inst=prepararInstitucion({id:crearId(),nombreEscuela:nombre,nivelInstitucion:nivel,datosCurso:{},tiposCurso:{},cursosNombres:cursos,listaAlumnos:[],registrosAlumnos:{}});

function descargarBackup(){
  try{
    const data=JSON.stringify(db,null,2);
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="mis_datos_trayectorias_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){alert("No se pudo generar el backup.");}
}

function cargarBackup(e){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const nuevo=fusionarConDefault(JSON.parse(ev.target.result));
      if(!confirm("Esto reemplazará los datos actuales por los del backup. ¿Continuar?"))return;
      db=nuevo;
      if(guardar()){
        alert("Datos cargados correctamente.");
        mostrarInicio();
      }
    }catch(err){
      console.error(err);
      alert("El archivo de backup está dañado o no tiene el formato correcto. Los datos actuales NO fueron modificados.");
    }finally{e.target.value="";}
  };
  reader.readAsText(file);
}

function cargarCursos(t){
  try{
    const cursos=Array.isArray(db.cursosNombres?.[t])?db.cursosNombres[t]:[];
    let html=`<h2>Turno ${esc(t)}</h2><button class="volver" onclick="mostrarInicio()">← Volver</button>`;
    cursos.forEach((c,i)=>{
      html+=`
      <div class="curso-linea">
        <button class="curso-btn" data-curso-index="${i}" data-turno="${esc(t)}" style="flex:1">${esc(c)}</button>
        <button class="edit-btn" onclick="editarCurso(${jsArg(t)},${i})">✏️</button>
        <button class="edit-btn del-btn" onclick="eliminarCurso(${jsArg(t)},${i})">🗑️</button>
      </div>`;
    });
    html+=`<button class="add-btn" onclick="agregarCurso(${jsArg(t)})">➕ Agregar Curso</button>`;
    document.getElementById("app").innerHTML=html;

    document.querySelectorAll(".curso-btn").forEach(btn=>{
      btn.addEventListener("click",function(){
        try{
          const turno=this.dataset.turno;
          const indice=Number(this.dataset.cursoIndex);
          const curso=(db.cursosNombres[turno]||[])[indice];
          if(curso===undefined){ alert("No se pudo identificar el curso."); return; }
          verDetalle(curso,turno);
        }catch(err){
          console.error("Error al abrir curso:",err);
          alert("No se pudo abrir el curso. Los datos no fueron modificados.\n\nDetalle: "+err.message);
        }
      });
    });
  }catch(err){
    console.error("Error al cargar cursos:",err);
    document.getElementById("app").innerHTML=`<div class="alerta"><b>No se pudieron mostrar los cursos.</b><br>${esc(err.message)}</div><button class="volver" onclick="mostrarInicio()">← Volver</button>`;
  }
}

function editarCurso(t,i){
  const actual=db.cursosNombres[t][i];
  const n=prompt("Editar nombre del curso:",actual);
  if(n!==null&&n.trim()){
    const nuevo=n.trim();
    if(nuevo!==actual && db.cursosNombres[t].includes(nuevo)) return alert("El curso ya existe.");
    db.cursosNombres[t][i]=nuevo;
    if(db.tiposCurso && db.tiposCurso[actual] && !db.tiposCurso[nuevo]){
      db.tiposCurso[nuevo]=db.tiposCurso[actual];
    }
    if(db.tiposCurso && actual!==nuevo) delete db.tiposCurso[actual];
    // Si se renombra un curso, los alumnos siguen siendo los mismos y se actualiza su curso actual.
    db.listaAlumnos.forEach(a=>{
      if(a.curso===actual){
        a.curso=nuevo;
        if(Array.isArray(a.historialCursos)) a.historialCursos.forEach(m=>{if(m.curso===actual)m.curso=nuevo;});
      }
    });
    guardar();cargarCursos(t);
  }
}

function eliminarCurso(t,i){
  const c=db.cursosNombres[t][i];
  if(!confirm("¿Eliminar el curso "+c+" de la lista? Los alumnos existentes no serán borrados."))return;
  db.cursosNombres[t].splice(i,1);
  guardar();cargarCursos(t);
}

function agregarCurso(t){
  const n=prompt("Nombre del nuevo curso / sala (ej: 1° A, Sala 5 A):");
  if(!n||!n.trim())return;
  const nombre=n.trim();
  if(!db.cursosNombres[t])db.cursosNombres[t]=[];
  if(db.cursosNombres[t].includes(nombre))return alert("El curso ya existe.");
  let tipo="flexible";
  if(db.nivelInstitucion==="Primario"){
    tipo=confirm("¿Este curso utilizará el seguimiento estructurado de Fortalecimiento?\\n\\nAceptar = Fortalecimiento.\\nCancelar = Seguimiento flexible.")?"fortalecimiento":"flexible";
  }
  db.cursosNombres[t].push(nombre); db.tiposCurso[nombre]=tipo;
  if(guardar())cargarCursos(t);
}

function verDetalle(c,t){
  try{
  if(!db.datosCurso || typeof db.datosCurso!=="object") db.datosCurso={};
  if(!db.datosCurso[c])db.datosCurso[c]={total:0,fort:0};
  const alumnos=db.listaAlumnos.filter(a=>a.curso===c);
  const activos=alumnos.filter(a=>a.activo!==false).length;
  document.getElementById("app").innerHTML=`
    <h2>Curso: ${esc(c)}</h2>
    <div class="resumen-caja"><b>Modalidad:</b> ${esCursoFlexible(c)?"🟡 Seguimiento flexible":"🟢 Fortalecimiento estructurado"}</div>
    <div class="stats-box">
      Total alumnos: ${esc(db.datosCurso[c].total)}
      <button class="edit-btn" onclick="editarDatoCurso(${jsArg(c)},'total',${jsArg(t)})">Edit</button><br><br>
      En Fortalecimiento: ${esc(db.datosCurso[c].fort)}
      <button class="edit-btn" onclick="editarDatoCurso(${jsArg(c)},'fort',${jsArg(t)})">Edit</button>
      <hr>
      Registrados en la app: ${alumnos.length} · Activos: ${activos}
    </div>
    <button class="volver" onclick="cargarCursos(${jsArg(t)})">← Volver</button>
    <button class="cat-btn" onclick="verCats(${jsArg(c)},${jsArg(t)})">🟢 ${db.nivelInstitucion==="Primario"?"Categorías de Escritura":"Seguimiento de alumnos"}</button>`;
  }catch(err){
    console.error("Error al abrir detalle del curso:",err);
    document.getElementById("app").innerHTML=`<div class="alerta"><b>No se pudo abrir este curso.</b><br>${esc(err.message)}</div><button class="volver" onclick="cargarCursos(${jsArg(t)})">← Volver a cursos</button>`;
  }
}

function editarDatoCurso(c,campo,t){
  const v=prompt("Valor:",db.datosCurso[c][campo]);
  if(v!==null&&v!==""){
    db.datosCurso[c][campo]=Number(v)||0;
    guardar();verDetalle(c,t);
  }
}

  if(esNivelSinFortalecimiento()) return verSeguimientoAbierto(c,t);

  <div class="resumen-caja"><b>${esCursoFlexible(c)?"🟡 Seguimiento flexible":"🟢 Seguimiento de Fortalecimiento"}</b><br><small>${esCursoFlexible(c)?"Las categorías se conservan, pero cada registro permite observaciones abiertas.":"Se utilizan los campos estructurados de seguimiento."}</small></div>
  <button class="volver" onclick="verDetalle(${jsArg(c)},${jsArg(t)})">← Volver</button>`;

      html+=`<button class="${a.activo===false?"inactivo":"alumno-btn"}" onclick="abrirFicha(${jsArg(a.id)},${jsArg(c)},${jsArg(t)})">
        👤 ${esc(a.nombre)} ${a.activo===false?"(INACTIVO)":""}
      </button>`;
    });
    html+=`</div></div>`;
  });

  // Seguimiento de alumnos que no pertenecen a Fortalecimiento
  const otros=db.listaAlumnos.filter(a=>a.curso===c&&a.tipoSeguimiento==="otro");
  html+=`<div class="desc-box" style="border-left:5px solid #f39c12">

function agregarAlumno(c,t,cat){
  const input=document.getElementById("in-"+cat);
  const n=input?input.value.trim():"";
  if(!n)return alert("Ingresá el nombre del alumno.");
  const alumno={id:crearId(),nombre:n,cat,curso:c,activo:true,historialCursos:[{curso:c,desde:new Date().toISOString().slice(0,10),hasta:null,motivo:"Alta"}]};

function abrirFichaOtro(id,c,t){

function guardarProximoObjetivoOtro(id,c,t){
  const a=db.listaAlumnos.find(x=>x.id===id); if(!a)return;
  a.proximoObjetivo=document.getElementById("proximo-objetivo")?.value.trim()||"";
  if(guardar())abrirFichaOtro(id,c,t);
}
function guardarDatosOtro(id,c,t){
  const a=db.listaAlumnos.find(x=>x.id===id); if(!a)return;
  const n=document.getElementById("nom-otro")?.value.trim(); if(!n)return alert("El nombre no puede quedar vacío.");
  a.nombre=n; a.motivo=document.getElementById("motivo-otro")?.value||"Otro";
  if(guardar())abrirFichaOtro(id,c,t);
}
function cambiarActivoOtro(id,c,t){
  const a=db.listaAlumnos.find(x=>x.id===id); if(!a)return;
  a.activo=a.activo===false; if(guardar())abrirFichaOtro(id,c,t);
}
function toggleAreaOtro(el,area){
  el.classList.toggle("seleccionado");
  const areas=[...document.querySelectorAll('#otro-checks').length?document.querySelectorAll('.opcion-chip.seleccionado'):[]].map(x=>x.textContent.trim());
  const seleccionadas=[];
  document.querySelectorAll('.grid-opciones .opcion-chip.seleccionado').forEach(x=>{
    const txt=x.textContent.trim();
    if(txt.includes('Escritura'))seleccionadas.push('Escritura');
    else if(txt.includes('Lectura'))seleccionadas.push('Lectura');
    else if(txt.includes('Comprensión'))seleccionadas.push('Comprensión');
  });
  let html='';
  if(seleccionadas.includes('Escritura')){html+='<b>Para Escritura:</b>'; continuarEscrituraOpts.forEach(x=>html+=`<label class="checklist-item"><input type="checkbox" class="check-otro" value="${esc(x)}"> ${esc(x)}</label>`);}
  if(seleccionadas.includes('Lectura')){html+='<b>Para Lectura:</b>'; continuarLecturaOpts.forEach(x=>html+=`<label class="checklist-item"><input type="checkbox" class="check-otro" value="${esc(x)}"> ${esc(x)}</label>`);}
  if(seleccionadas.includes('Comprensión')){html+='<b>Para Comprensión:</b>'; continuarComprensionOpts.forEach(x=>html+=`<label class="checklist-item"><input type="checkbox" class="check-otro" value="${esc(x)}"> ${esc(x)}</label>`);}
  document.getElementById('otro-checks').innerHTML=html||'<small>Seleccioná un área para ver los aspectos específicos.</small>';
}

function guardarRegistroOtro(id,c,t){
  const a=db.listaAlumnos.find(x=>x.id===id); if(!a)return;
  const r={f:document.getElementById("otro-fecha")?.value||"",a:document.getElementById("otro-actividad")?.value.trim()||"",motivo:a.motivo||"Otro",obsAbierta:document.getElementById("otro-obs")?.value.trim()||"",proximo:document.getElementById("otro-proximo")?.value.trim()||"",evolucion:document.getElementById("otro-evolucion")?.value||"Se mantiene"};
  if(!r.a&&!r.obsAbierta)return alert("Completá al menos la intervención o la observación.");
  const continuar=[...document.querySelectorAll('.check-otro:checked')].map(x=>x.value);
  r.continuar=[...new Set(continuar)];
  const anterior=Array.isArray(db.registrosAlumnos[id])?db.registrosAlumnos[id].slice():[];
  const estadoAnterior=db;
  const nuevoEstado=deepClone(db);
  nuevoEstado.registrosAlumnos[id]=anterior.concat([r]);
  const proximo=r.proximo||a.proximoObjetivo||"";
  nuevoEstado.listaAlumnos=nuevoEstado.listaAlumnos.map(x=>x.id===id?{...x,proximoObjetivo:proximo}:x);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(nuevoEstado));
  const verificado=JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(!Array.isArray(verificado.registrosAlumnos?.[id])||verificado.registrosAlumnos[id].length!==anterior.length+1){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(estadoAnterior));
    throw new Error('La verificación del guardado falló.');
  }
  db=nuevoEstado;
  alert('✅ Intervención guardada. Historial anterior conservado.');
  abrirFichaOtro(id,c,t);
}

          <p class="small">El historial anterior se conserva. Cada guardado agrega un nuevo registro.</p>

        <button class="del-btn" onclick="eliminarAlumno(${jsArg(id)},${jsArg(c)},${jsArg(t)})">🗑️ Eliminar Alumno</button>
        <button class="volver" onclick="verCats(${jsArg(c)},${jsArg(t)})">← Volver</button>
      </div>

      <h3>📜 Historial Completo (${hist.length} registros)</h3>
      <div>${histHtml||'<p class="small">No hay registros todavía.</p>'}</div>
    `;
    calcularEvolucionAutomatica(id);
  }catch(error){
    /* MUY IMPORTANTE: jamás borrar registros desde aquí */
    console.error("Error al abrir ficha:",error);
    alert("Se produjo un error al mostrar la ficha. Los registros existentes NO fueron modificados.");
    verCats(c,t);
  }
}

function moverAlumnoCurso(id){
  const a=db.listaAlumnos.find(x=>x.id===id);
  if(!a)return;
  const selector=document.getElementById("select-curso-mover");
  const destino=selector?.value||"";
  if(!destino)return alert("Seleccioná un curso de destino.");
  if(destino===a.curso)return alert("El alumno ya pertenece a ese curso.");
  const origen=a.curso||"Sin curso";
  const ahora=new Date();
  const fecha=ahora.toISOString().slice(0,10);
  if(!confirm("¿Mover a "+a.nombre+" de "+origen+" a "+destino+"?\n\nSe conservará el mismo alumno, el mismo ID y TODO su historial.\n\nEsto sirve tanto para promoción como para cambios de curso durante el año."))return;

  const anterior=db;
  const nuevoEstado=deepClone(db);
  const alumno=nuevoEstado.listaAlumnos.find(x=>x.id===id);
  if(!alumno)return;
  if(!Array.isArray(alumno.historialCursos)) alumno.historialCursos=[];

  // Cierra el tramo actual y agrega el nuevo curso. No se crea otro alumno.
  const ultimo=alumno.historialCursos[alumno.historialCursos.length-1];
  if(ultimo && ultimo.curso===origen && !ultimo.hasta) ultimo.hasta=fecha;
  alumno.historialCursos.push({curso:destino,desde:fecha,hasta:null,motivo:"Movimiento de curso"});
  alumno.curso=destino;

  localStorage.setItem(STORAGE_KEY,JSON.stringify(nuevoEstado));
  const verificado=JSON.parse(localStorage.getItem(STORAGE_KEY));
  const mismoAlumno=verificado.listaAlumnos.filter(x=>x.id===id);
  if(mismoAlumno.length!==1){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(anterior));
    throw new Error("La verificación detectó una inconsistencia de identidad del alumno.");
  }
  db=nuevoEstado;
  const turnoDestino=obtenerTurnoDeCurso(destino);
  alert("✅ Alumno movido correctamente.\n\n"+a.nombre+" ahora pertenece a "+destino+".\nSu historial y su mismo ID fueron conservados.");
  if(turnoDestino) verCats(destino,turnoDestino);
}

function moverAlumno(id,c,t){
  const a=db.listaAlumnos.find(x=>x.id===id);
  if(!a)return;
  const destino=document.getElementById("select-cat-mover").value;
  if(destino===a.cat)return alert("El alumno ya pertenece a esa categoría.");
  if(!confirm("¿Mover a "+a.nombre+" a la nueva categoría? Se conservará el mismo ID y TODO su historial.\n\nNo se crea otro alumno: solamente cambia su categoría."))return;
  // IMPORTANTE: se modifica el mismo objeto/alumno. No se hace push y no se crea un nuevo ID.
  a.cat=destino;
  if(guardar()){
    alert("Alumno movido. Su historial fue conservado y no se creó ningún duplicado.");
    verCats(c,t);
  }
}

function copiarAlumno(id,c,t){
  const a=db.listaAlumnos.find(x=>x.id===id);
  if(!a)return;
  const destino=document.getElementById("select-cat-mover").value;
  const nuevo={...deepClone(a),id:crearId(),cat:destino,nombre:a.nombre+" (copia)"};
  db.listaAlumnos.push(nuevo);
  db.registrosAlumnos[nuevo.id]=deepClone(obtenerHistorial(id));
  if(guardar()){
    alert("Alumno copiado con su historial.");
    verCats(c,t);
  }
}

function eliminarAlumno(id,c,t){
  const a=db.listaAlumnos.find(x=>x.id===id);
  if(!a)return;
  if(!confirm("¿Eliminar definitivamente a "+a.nombre+" y todo su historial? Esta acción requiere un backup previo si querés conservarlo."))return;
  db.listaAlumnos=db.listaAlumnos.filter(x=>x.id!==id);
  delete db.registrosAlumnos[id];
  if(guardar())verCats(c,t);
}

let ultimoNivelEscrituraAnterior=null;

function calcularEvolucionAutomatica(id){
  const h=obtenerHistorial(id);
  const r=h.length?h[h.length-1]:null;
  ultimoNivelEscrituraAnterior=r&&Number.isFinite(r.escrituraNumber)?r.escrituraNumber:null;
}

function evaluarEvolucionDinamica(){
  const val=document.getElementById("reg-escritura-sel").value;
  if(!val||ultimoNivelEscrituraAnterior===null)return;
  const actual=parseInt(val.split(".")[0]);
  let sugerida="Se mantiene";
  if(actual>ultimoNivelEscrituraAnterior)sugerida="Avanza";
  else if(actual<ultimoNivelEscrituraAnterior)sugerida="Presenta retroceso";
  const chips=[...document.querySelectorAll("[data-nivel]")];
  chips.forEach(ch=>{
    if(ch.parentElement?.querySelector("#reg-evolucion-sel")){
      ch.classList.toggle("seleccionado",ch.dataset.nivel===sugerida);
      if(ch.dataset.nivel===sugerida)document.getElementById("reg-evolucion-sel").value=sugerida;
    }
  });
}

function generarRedaccionAutomatica(){
  let areas=[];
  try{areas=JSON.parse(document.getElementById("reg-areas-sel").value||"[]")}catch(e){}
  const escritura=document.getElementById("reg-escritura-sel").value;
  const lectura=document.getElementById("reg-lectura-sel").value;
  const comp=document.getElementById("reg-comprension-sel").value;
  const apoyo=document.getElementById("reg-apoyo-sel").value;
  const evo=document.getElementById("reg-evolucion-sel").value;
  const continuar=[...document.querySelectorAll(".check-continuar:checked")].map(x=>x.value);
  const otro=document.getElementById("reg-continuar-otro").value.trim();
  if(otro)continuar.push(otro);

  let texto="Se registra intervención educativa en las áreas de "+(areas.join(", ")||"las propuestas escolares")+". ";
  if(evo==="Avanza")texto+="Se observa evolución favorable en el proceso. ";
  else if(evo==="Se mantiene")texto+="Se observa continuidad y consolidación del proceso. ";
  else if(evo)texto+="Se observan dificultades que requieren seguimiento. ";
  if(escritura)texto+=`En escritura se ubica en ${escritura.toLowerCase()}. `;
  if(lectura)texto+=`En lectura se evidencia ${lectura.toLowerCase()}. `;
  if(comp)texto+=`En comprensión lectora presenta un nivel ${comp.toLowerCase()}. `;
  if(apoyo)texto+=`Requiere un nivel de apoyo ${apoyo.toLowerCase()}. `;
  if(continuar.length)texto+=`Se propone continuar trabajando ${continuar.join(", ")}.`;
  document.getElementById("reg-obs-generada").value=texto;
}


function guardarRegistroFlexible(id,c,t){
  const btn=document.getElementById("btn-flex");
  if(btn){btn.disabled=true;btn.innerText="⏳ Guardando...";}
  try{
    const alumno=db.listaAlumnos.find(x=>x.id===id);
    if(!alumno)throw new Error("No se encontró el alumno.");
    const fecha=document.getElementById("flex-fecha").value;
    if(!fecha)throw new Error("Seleccioná una fecha.");

    const nuevo={
      idRegistro:crearId(),
      f:fecha,
      a:document.getElementById("flex-actividad").value.trim(),
      areas:["Seguimiento flexible"],
      catObservada:document.getElementById("flex-cat").value,
      fortalezas:document.getElementById("flex-fortalezas").value.trim(),
      dificultades:document.getElementById("flex-dificultades").value.trim(),
      obsAbierta:document.getElementById("flex-obs").value.trim(),
      proximo:document.getElementById("flex-proximo").value.trim(),
      creadoEn:new Date().toISOString()
    };

    const anterior=Array.isArray(db.registrosAlumnos[id])?db.registrosAlumnos[id].slice():[];
    const estadoAnterior=db;
    const nuevoEstado=deepClone(db);
    nuevoEstado.registrosAlumnos[id]=anterior.concat([nuevo]);
    nuevoEstado.listaAlumnos=nuevoEstado.listaAlumnos.map(x=>x.id===id?{...x,cat:nuevo.catObservada,activo:true}:x);

    localStorage.setItem(STORAGE_KEY,JSON.stringify(nuevoEstado));
    const verificado=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(!Array.isArray(verificado.registrosAlumnos?.[id])||verificado.registrosAlumnos[id].length!==anterior.length+1){
      localStorage.setItem(STORAGE_KEY,JSON.stringify(estadoAnterior));
      throw new Error("La verificación del guardado falló.");
    }

    db=nuevoEstado;
    alert("✅ Registro guardado definitivamente. Historial anterior conservado.");
    abrirFicha(id,c,t);
  }catch(e){
    console.error(e);
    alert("❌ No se pudo guardar. Los registros anteriores fueron conservados.\\n\\n"+e.message);
    if(btn){btn.disabled=false;btn.innerText="💾 Guardar Registro Definitivamente";}
  }
}

/* =========================================================
   GUARDADO DEFINITIVO
   La operación agrega un registro. Nunca reemplaza el historial.
========================================================= */

function guardarRegistroEstructurado(id,c,t){
  const btn=document.getElementById("btn-guardar-reg");
  if(btn){btn.disabled=true;btn.innerText="⏳ Guardando...";}

  try{
    const alumno=db.listaAlumnos.find(x=>x.id===id);
    if(!alumno)throw new Error("No se encontró el alumno.");

    const fecha=document.getElementById("reg-fecha").value;
    if(!fecha)throw new Error("Seleccioná una fecha.");

    let areas=[];
    try{areas=JSON.parse(document.getElementById("reg-areas-sel").value||"[]")}catch(e){areas=[];}

    const actividad=document.getElementById("reg-actividad").value.trim();
    const escritura=document.getElementById("reg-escritura-sel").value;
    const escrituraNumber=escritura?parseInt(escritura.split(".")[0]):null;
    const lectura=document.getElementById("reg-lectura-sel").value;
    const comprension=document.getElementById("reg-comprension-sel").value;
    const apoyo=document.getElementById("reg-apoyo-sel").value;
    const evolucion=document.getElementById("reg-evolucion-sel").value||"Se mantiene";

    const continuar=[...document.querySelectorAll(".check-continuar:checked")].map(x=>x.value);
    const otro=document.getElementById("reg-continuar-otro").value.trim();
    if(otro)continuar.push(otro);

    const obs=document.getElementById("reg-obs").value.trim();
    const generada=document.getElementById("reg-obs-generada").value.trim();
    const obsFinal=generada?(generada+(obs?" Nota: "+obs:"")):obs;

    const nuevoRegistro={
      idRegistro:crearId(),
      f:fecha,
      a:actividad,
      areas:[...areas],
      escritura:escritura||"No registrado",
      escrituraNumber:Number.isFinite(escrituraNumber)?escrituraNumber:null,
      lectura:lectura||"No registrado",
      comprension:comprension||"No registrado",
      apoyo:apoyo||"No registrado",
      evolucion,
      continuar:[...new Set(continuar)],
      obsCompromiso:obsFinal,
      o:obsFinal,
      creadoEn:new Date().toISOString()
    };

    const historialAnterior=Array.isArray(db.registrosAlumnos[id])
      ?db.registrosAlumnos[id].slice()
      :[];

    const historialNuevo=historialAnterior.concat([nuevoRegistro]);

    /* Validación: el nuevo historial debe contener todos los registros anteriores */
    if(historialNuevo.length!==historialAnterior.length+1){
      throw new Error("No se pudo validar el nuevo historial.");
    }

    /* Guardamos primero una copia completa en localStorage */
    const estadoAnterior=db;
    const estadoNuevo=deepClone(db);
    estadoNuevo.registrosAlumnos[id]=historialNuevo;
    estadoNuevo.listaAlumnos=estadoNuevo.listaAlumnos.map(x=>
      x.id===id?{...x,activo:true}:x
    );

    const serializado=JSON.stringify(estadoNuevo);
    localStorage.setItem(STORAGE_KEY,serializado);

    /* Solo después de confirmar que localStorage aceptó el dato,
       reemplazamos el estado en memoria. */
    db=estadoNuevo;

    /* Verificación inmediata: leemos nuevamente lo guardado */
    const verificacion=JSON.parse(localStorage.getItem(STORAGE_KEY));
    const histVerificado=verificacion.registrosAlumnos?.[id];

    if(!Array.isArray(histVerificado)||histVerificado.length!==historialNuevo.length){
      /* Restaurar el estado anterior */
      localStorage.setItem(STORAGE_KEY,JSON.stringify(estadoAnterior));
      db=estadoAnterior;
      throw new Error("La verificación del guardado falló. Se conservaron los datos anteriores.");
    }

    alert("✅ Registro guardado definitivamente.\\n\\nHistorial anterior conservado: "+historialAnterior.length+"\\nRegistros totales: "+histVerificado.length);
    abrirFicha(id,c,t);

  }catch(error){
    console.error("Error al guardar registro:",error);
    alert("❌ NO se pudo guardar el registro.\\n\\nLos registros anteriores fueron conservados.\\n\\nMotivo: "+error.message);
    if(btn){btn.disabled=false;btn.innerText="💾 GUARDAR REGISTRO DEFINITIVAMENTE";}
  }
}
